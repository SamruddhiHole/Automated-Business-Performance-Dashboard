name: Automated Retail Data Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'

jobs:
  test_and_validate:
    name: Test & Quality Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Test Suite (Pytest)
        run: |
          pytest tests/ -v --tb=short

      - name: Verify Schema and SQL Syntax
        run: |
          python -c "import sqlite3; conn = sqlite3.connect(':memory:'); conn.executescript(open('sql/schema.sql').read()); print('Schema verified successfully.')"

      - name: Upload Test Quality Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-test-reports
          path: |
            reports/*.csv
            reports/*.txt
          if-no-files-found: ignore
